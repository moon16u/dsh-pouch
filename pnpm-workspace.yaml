packages:
  - 'packages/*'

# Transitive build scripts from @earendil-works/pi-ai's Google/Vertex path.
# Those protocols are never reached from this workspace, so their postinstall
# codegen is not needed. `allowBuilds` is what pnpm 11 reads;
# `ignoredBuiltDependencies` is the pnpm 10 spelling CI still installs with.
allowBuilds:
  '@google/genai': false
  protobufjs: false
ignoredBuiltDependencies:
  - '@google/genai'
  - protobufjs
