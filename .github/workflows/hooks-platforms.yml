name: Hooks Native Platforms

on:
  push:
    branches: [main, 'codex/hooks-*']
    paths:
      - 'packages/dsh-hooks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-platforms.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/dsh-hooks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hooks-platforms.yml'

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test hook contracts and native official subprocess
        run: pnpm --filter @moon16u/dsh-hooks test
